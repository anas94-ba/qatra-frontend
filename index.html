<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b63b5" />
    <meta name="description" content="قطرة: منصة تنسيق توزيع مياه الشرب على مخيمات غزة بحسب الاحتياج" />
    <!-- Icon set: .ico for legacy browsers, SVG for modern ones, PNG for iOS; PWA icons live in the manifest -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>قطرة</title>
    <script>
      // Apply the saved language before first paint (no RTL/LTR flash)
      try { var l = localStorage.getItem('qatra.lang') === 'en' ? 'en' : 'ar'; document.documentElement.lang = l; document.documentElement.dir = l === 'en' ? 'ltr' : 'rtl'; } catch (e) {}
    </script>
    <style>
      /* Critical CSS for the boot screen: visible immediately, replaced when React mounts */
      html, body { margin: 0; background: #f4f8fc; }
      .boot { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 1.25rem; }
      .boot img { width: 84px; height: auto; animation: boot-pulse 1.6s ease-in-out infinite; }
      .boot-spinner { width: 30px; height: 30px; border: 3px solid #cfeafe; border-top-color: #0b63b5; border-radius: 50%; animation: boot-spin .8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-pulse { 50% { transform: scale(1.06); opacity: .85; } }
      @media (prefers-reduced-motion: reduce) { .boot img, .boot-spinner { animation-duration: 4s; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <img src="/src/assets/images/logo.webp" alt="" width="62" height="84" />
        <div class="boot-spinner"></div>
      </div>
    </div>
    <noscript>This site needs JavaScript. / هذا الموقع يحتاج تفعيل JavaScript.</noscript>
    <!-- Runtime settings (API URL); regenerated from the container environment on start -->
    <script src="/env-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
