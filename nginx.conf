server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  location = /healthz { access_log off; return 200 "ok"; }

  # Fingerprinted build output (JS, CSS and the WebP images): safe to cache for a year
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include snippets/security-headers.conf;
  }

  # Runtime settings must never be cached, otherwise a changed API URL would not apply
  location = /env-config.js {
    add_header Cache-Control "no-store";
    include snippets/security-headers.conf;
  }

  # Icons and the manifest keep fixed names, so cache them for a day only
  location ~* ^/(favicon\.ico|favicon\.svg|apple-touch-icon\.png|icon-[\w-]+\.png|manifest\.webmanifest)$ {
    add_header Cache-Control "public, max-age=86400";
    include snippets/security-headers.conf;
  }

  # Single-page app: unknown paths fall back to index.html, which is always revalidated
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    include snippets/security-headers.conf;
  }
}
